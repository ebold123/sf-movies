name: Scrape Music Venues

on:
  schedule:
    - cron: "17 13 * * *" # daily, ~6:17am Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run scrape:music

      - name: Commit and push if data changed
        # Runs even if a venue failed to scrape above, so the venues that did
        # succeed still get committed.
        if: always()
        run: |
          if git diff --quiet -- movie-data; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movie-data
          git commit -m "Update music venue showtimes"
          git push
